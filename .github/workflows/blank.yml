name: Update Current Affairs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-current-affairs
  cancel-in-progress: false

jobs:
  update-current-affairs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Current Affairs
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import random
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ.get("NEWS_API_KEY")

          if not API_KEY:
              raise RuntimeError("NEWS_API_KEY secret is missing.")

          categories = {
              "Daily": "India latest news",
              "National": "India national news",
              "International": "world international news",
              "Sports": "India sports",
              "Awards": "India awards",
              "Appointments": "India appointments",
              "Economy": "India economy",
              "Science & Technology": "India science technology",
              "Government Schemes": "India government schemes",
              "Current Affairs MCQ": "India current affairs"
          }

          def get_news(query):
              params = urllib.parse.urlencode({
                  "q": query,
                  "language": "en",
                  "sortBy": "publishedAt",
                  "pageSize": 50,
                  "apiKey": API_KEY
              })

              url = "https://newsapi.org/v2/everything?" + params

              with urllib.request.urlopen(url, timeout=40) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              if data.get("status") != "ok":
                  raise RuntimeError(
                      "NewsAPI error: " + str(data)
                  )

              articles = []

              for article in data.get("articles", []):
                  title = article.get("title")

                  if not title:
                      continue

                  if title == "[Removed]":
                      continue

                  articles.append(article)

              return articles

          print("Fetching current affairs...")

          news = {}

          for category, query in categories.items():
              print("Fetching:", category)
              news[category] = get_news(query)
              print(
                  category,
                  "articles:",
                  len(news[category])
              )

          random.seed(
              datetime.now(timezone.utc).strftime("%Y-%m-%d")
          )

          result = {}

          for category, articles in news.items():

              questions = []

              # Remove duplicate headlines
              unique_articles = []
              seen_titles = set()

              for article in articles:
                  title = article.get("title", "").strip()

                  if not title:
                      continue

                  if title in seen_titles:
                      continue

                  seen_titles.add(title)
                  unique_articles.append(article)

             for target in articles:

                  correct = target["title"].strip()

                  # Collect wrong options from other categories
                  candidates = []

                  for other_category, other_articles in news.items():

                      if other_category == category:
                          continue

                      for article in other_articles:

                          title = article.get(
                              "title", ""
                          ).strip()

                          if not title:
                              continue

                          if title == correct:
                              continue

                          if title in candidates:
                              continue

                          candidates.append(title)

                  # Need exactly 3 wrong options
                  if len(candidates) < 3:
                      continue

                  wrong_options = random.sample(
                      candidates,
                      3
                  )

                  options = [
                      correct,
                      wrong_options[0],
                      wrong_options[1],
                      wrong_options[2]
                  ]

                  random.shuffle(options)

                  questions.append({
                      "q": (
                          f"हाल की खबरों के अनुसार "
                          f"{category} से संबंधित खबर कौन-सी है?"
                      ),
                      "o": options,
                      "a": options.index(correct),
                      "source": target.get("url", ""),
                      "publishedAt": target.get(
                          "publishedAt", ""
                      )
                  })

              result[category] = questions

          result["_updatedAt"] = (
              datetime.now(timezone.utc).isoformat()
          )

          with open(
              "current-affairs.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          total = sum(
              len(v)
              for k, v in result.items()
              if isinstance(v, list)
          )

          print(
              "Successfully generated",
              total,
              "four-option questions."
          )
          PY

      - name: Commit and Push Current Affairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main

          git add current-affairs.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update 4-option Current Affairs"
            git pull --rebase origin main
            git push origin main
          fi