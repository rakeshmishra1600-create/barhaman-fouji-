name: Update Current Affairs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update date
        run: |
          echo "Current Affairs update workflow is running"
          date -u > update-time.txt

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-time.txt
          git diff --cached --quiet || git commit -m "Update current affairs"
          git push