name: Update Current Affairs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-current-affairs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Current Affairs
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import random
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["NEWS_API_KEY"]

          categories = {
              "Daily": "India latest news",
              "National": "India national news",
              "International": "world international news",
              "Sports": "India sports",
              "Awards": "India awards",
              "Appointments": "India appointments",
              "Economy": "India economy",
              "Science & Technology": "India science technology",
              "Government Schemes": "India government schemes",
              "Current Affairs MCQ": "India current affairs"
          }

          def get_news(query):
              params = urllib.parse.urlencode({
                  "q": query,
                  "language": "en",
                  "sortBy": "publishedAt",
                  "pageSize": 50,
                  "apiKey": API_KEY
              })

              url = "https://newsapi.org/v2/everything?" + params

              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))

              return [
                  article for article in data.get("articles", [])
                  if article.get("title")
                  and article.get("title") != "[Removed]"
              ]

          random.seed(datetime.now(timezone.utc).strftime("%Y-%m-%d"))

          news = {}

          for category, query in categories.items():
              news[category] = get_news(query)

          result = {}

          for category, articles in news.items():

              questions = []

              for target in articles[:10]:

                  correct = target["title"]

                  # दूसरी categories से 3 अलग headlines
                  wrong = []

                  for other_category, other_articles in news.items():

                      if other_category == category:
                          continue

                      for article in other_articles:

                          title = article.get("title")

                          if title and title != correct:
                              wrong.append(title)

                          if len(wrong) >= 3:
                              break

                      if len(wrong) >= 3:
                          break

                  if len(wrong) < 3:
                      continue

                  options = [correct] + wrong[:3]

                  random.shuffle(options)

                  questions.append({
                      "q": f"हाल की खबरों के अनुसार {category} से संबंधित खबर कौन-सी है?",
                      "o": options,
                      "a": options.index(correct),
                      "source": target.get("url", ""),
                      "publishedAt": target.get("publishedAt", "")
                  })

              result[category] = questions

          result["_updatedAt"] = datetime.now(timezone.utc).isoformat()

          with open("current-affairs.json", "w", encoding="utf-8") as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("4-option Current Affairs generated successfully.")
          PY

      - name: Save Updated Questions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add current-affairs.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto update 4-option Current Affairs"
            git push
          fi